name: Validate site
on:
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Import canonical conformance snapshot
        run: node tools/sync_conformance.mjs
      - name: Conformance import regression tests
        run: node --test tools/sync_conformance.test.mjs
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: node tools/smoke_test.mjs
