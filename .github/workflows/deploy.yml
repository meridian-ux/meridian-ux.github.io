name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      WASM_BINDGEN_VERSION: "0.2.105"
    steps:
      - uses: actions/checkout@v4
      - name: Read the Meridian source pin
        id: source
        run: |
          revision=$(cat tools/meridian-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: meridian-ux/meridian
          ref: ${{ steps.source.outputs.revision }}
          path: .meridian-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the Rust and protobuf toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            .meridian-source/target
            ~/.cache/meridian-wasm-tools
          key: tui-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.WASM_BINDGEN_VERSION }}-${{ steps.source.outputs.revision }}
      - name: Build and exercise all TUI previews
        run: |
          tool_dir="$HOME/.cache/meridian-wasm-tools"
          if [[ ! -x "$tool_dir/bin/wasm-bindgen" ]]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --root "$tool_dir"
          fi
          PATH="$tool_dir/bin:$PATH" bash tools/build-tui-preview.sh .meridian-source
      - name: Import conformance from the preview source
        env:
          MERIDIAN_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          node tools/sync_conformance.mjs --revision "$MERIDIAN_REVISION" --manifest .meridian-source/schemas/conformance/coverage.json
          node --test tools/sync_conformance.test.mjs
      - run: pnpm build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - name: Verify routes, coverage, and gallery assets
        run: MERIDIAN_REQUIRE_TUI_ASSETS=1 node tools/smoke_test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
